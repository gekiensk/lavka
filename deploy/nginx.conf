# Пример настройки nginx для сайта. Скопируйте на сервер:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/santeh-lavka
#   sudo ln -s /etc/nginx/sites-available/santeh-lavka /etc/nginx/sites-enabled/
# Замените santeh-lavka.ru на свой домен и путь /var/www/lavka, если проект лежит в другом месте.
# HTTPS (порт 443 и сертификат) добавит certbot: sudo certbot --nginx -d santeh-lavka.ru -d www.santeh-lavka.ru

# www → без www
server {
    listen 80;
    server_name www.santeh-lavka.ru;
    return 301 http://santeh-lavka.ru$request_uri;
}

server {
    listen 80;
    server_name santeh-lavka.ru;

    # Загрузка фото и файлов импорта из админки (Excel может быть большим)
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Фото, загруженные через админку, nginx отдаёт сам — так быстрее
    location /uploads/ {
        alias /var/www/lavka/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Всё остальное — приложение Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
