# База PostgreSQL для локальной разработки: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavka
      POSTGRES_PASSWORD: lavka
      POSTGRES_DB: lavka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
